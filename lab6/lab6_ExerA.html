<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock, Paper, Scissors</title>
    <!-- Link external CSS stylesheet -->
    <link rel="stylesheet" href="game.css">
</head>
<body>

    <div class="container">
        <!-- Header section with game title and short instruction -->
        <header>
            <h1>Rock, Paper, Scissors</h1>
            <p>Enter your name, click Start Game, then choose Rock, Paper or Scissors.</p>
        </header>

        <!-- Player section for entering name and starting the game -->
        <section class="card player-section">
            <div class="input-group">
                <label for="playerName"><strong>Your name:</strong></label>
                <input type="text" id="playerName" placeholder="Enter your name">
                <button type="button" onclick="startGame()">Start Game</button>
            </div>
            <p id="welcomeMsg"></p>
        </section>

        <!-- Game section with choice buttons and choice images -->
        <section class="card game-section">
            <div class="choice-buttons">
                <button type="button" onclick="playRound('rock')">Rock</button>
                <button type="button" onclick="playRound('paper')">Paper</button>
                <button type="button" onclick="playRound('scissors')">Scissors</button>
            </div>

            <div class="arena">
                <div class="fighter">
                    <h3>You</h3>
                    <img id="playerImg" src="rock.png" alt="Player Choice">
                </div>
                <div class="vs-text">VS</div>
                <div class="fighter">
                    <h3>Computer</h3>
                    <img id="computerImg" src="rock.png" alt="Computer Choice">
                </div>
            </div>
        </section>

        <!-- Result section showing round outcome and scoreboard -->
        <section class="card result-section">
            <p id="result"></p>
            <div class="scoreboard">
                <span>Wins: <strong id="wins">0</strong></span>
                <span>Losses: <strong id="losses">0</strong></span>
                <span>Draws: <strong id="draws">0</strong></span>
            </div>
        </section>

        <!-- History section with round history table and summary/reset controls -->
        <section class="card history-section">
            <h2>History</h2>
            <table id="history">
                <thead>
                    <tr>
                        <th>Round</th>
                        <th>You</th>
                        <th>Computer</th>
                        <th>Result</th>
                    </tr>
                </thead>
                <tbody id="historyBody">
                    <!-- Round rows will be dynamically added here -->
                </tbody>
            </table>

            <div class="control-buttons">
                <button type="button" onclick="showSummary()">Show Summary</button>
                <button type="button" onclick="resetGame()">Reset</button>
            </div>
            <p id="summaryText"></p>
        </section>

        <!-- Footer displaying start timestamp and copyright -->
        <footer>
            <p id="startTime"></p>
            <p>&copy; 2026 Computer Science Club</p>
        </footer>
    </div>

    <!-- Link external JavaScript file -->
    <script src="game.js"></script>
</body>
</html>
